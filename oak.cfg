# Oak project configuration.
#
# Read automatically when compiling from this directory (or from a file next
# to it): --config <file> overrides discovery, and command-line flags always
# win over anything set here. `key = value`, `#` or `;` starts a comment.

# C compiler to drive. Default: gcc.
#   gcc | clang | cc        whichever is on PATH
#   tcc                     uses dependencies/tcc/tcc.exe when present
#   path/to/compiler.exe    used verbatim
cc = gcc

# C standard passed as -std=<value>. Use `-` to omit the flag entirely.
std = c99

# Optimization level passed as -O<value>. Use `-` to omit the flag.
# TCC accepts and ignores -O (it does not optimize).
opt = 2

# Default output path when -o is not given on the command line.
# out = build/app

# Keep the generated C file instead of deleting it after a successful build.
# keep_c = true

# Extra flags appended to every compile/link line, space separated.
# Shorthands for the raylib demo would be:
#   flags = -Iexamples/raylib examples/raylib/raylib_shim.c -lraylib -lgdi32 -lwinmm -lm
#
# Note for TCC on Windows: there is no separate libm, so `-lm` fails with
# "library 'm' not found" — drop it when using cc = tcc.
